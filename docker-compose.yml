# Local Postgres for the watchlist. Production uses Neon; keep the major version in sync.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
